<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
    
        .div1 {
            width: 200px;
            height: 200px;
            position: relative;
            background-color: rgb(15, 229, 140);
            animation-name: example;
            animation-duration: 4s;
            animation-delay: 3s;
            animation-iteration-count: infinite;
            border-radius: 100px;
        }

         .div2 {
            width: 200px;
            height: 200px;
            position: relative;
            background-color: rgb(15, 229, 140);
            animation-name: example1;
            animation-duration: 4s;
            animation-delay: 4s;
            animation-iteration-count: infinite;
            border-radius: 100px;
        }

        @keyframes example {
            0%   {background-color: rgb(21, 104, 229); left:0px; top:0px;}
            25%  {background-color: rgb(234, 15, 212); left:400px; top:200px;}
            50%  {background-color: rgb(225, 179, 12); left:900px; top:100px;}
            75%  {background-color: rgb(217, 10, 10); left:0px; top:500px;}
            100% {background-color: rgb(26, 4, 224); left:300px; top:0px;}
        }

        @keyframes example1 {
            0%   {background-color: rgb(21, 104, 229); left:300px; top:0px;}
            25%  {background-color: rgb(213, 4, 245); left:0px; top:500px;}
            50%  {background-color: rgb(225, 179, 12); left:900px; top:100px;}
            75%  {background-color: rgb(217, 10, 10); left:400px; top:200px;}
            100% {background-color: rgb(26, 4, 224); left:0px; top:0px;}
        }
    </style>
</head>
<body>

    <h1>CSS Animations</h1>
    <div class="div1"></div>
    <div class="div2"></div>
    
</body>
</html>
